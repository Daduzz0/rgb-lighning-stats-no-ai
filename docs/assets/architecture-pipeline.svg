<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgArch)"/>
  <rect x="16" y="16" width="1168" height="648" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="40" y="54" fill="#f8fafc" font-size="22" font-weight="700">Routing Architecture: Baseline Single-Path vs. AIR-GB AI + MPP Pipeline</text>
  <text x="40" y="78" fill="#94a3b8" font-size="13">How AIR-GB transforms natural language intents and first-party channel telemetry into guardrailed multi-path RGB Lightning settlements</text>

  <!-- TOP LANE: BASELINE (NO AI) -->
  <rect x="40" y="100" width="1120" height="165" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="56" y="114" width="250" height="24" rx="4" fill="#450a0a"/>
  <text x="66" y="130" fill="#fca5a5" font-size="11" font-weight="700">BASELINE STACK (rgb-lighning-stats-no-ai)</text>

  <!-- Baseline Step 1 -->
  <rect x="60" y="152" width="210" height="92" rx="8" fill="#27272a" stroke="#3f3f46"/>
  <text x="165" y="176" fill="#f4f4f5" font-size="13" font-weight="700" text-anchor="middle">1. Payment Request</text>
  <text x="165" y="196" fill="#a1a1aa" font-size="11" text-anchor="middle">POST /sendpayment</text>
  <text x="165" y="214" fill="#71717a" font-size="10" text-anchor="middle">Ignores natural language hints,</text>
  <text x="165" y="228" fill="#71717a" font-size="10" text-anchor="middle">fee budgets &amp; privacy intents</text>

  <line x1="270" y1="198" x2="330" y2="198" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- Baseline Step 2 -->
  <rect x="335" y="152" width="250" height="92" rx="8" fill="#27272a" stroke="#3f3f46"/>
  <text x="460" y="176" fill="#f4f4f5" font-size="13" font-weight="700" text-anchor="middle">2. Static Single-Path Config</text>
  <text x="460" y="196" fill="#fca5a5" font-size="11" font-family="monospace" text-anchor="middle">with_max_path_count(1)</text>
  <text x="460" y="214" fill="#a1a1aa" font-size="10" text-anchor="middle">Fixed LDK ProbabilisticScorer</text>
  <text x="460" y="228" fill="#71717a" font-size="10" text-anchor="middle">No RAG memory of RGB channel failures</text>

  <line x1="585" y1="198" x2="645" y2="198" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- Baseline Step 3 -->
  <rect x="650" y="152" width="230" height="92" rx="8" fill="#27272a" stroke="#3f3f46"/>
  <text x="765" y="176" fill="#f4f4f5" font-size="13" font-weight="700" text-anchor="middle">3. LDK Standard Dijkstra</text>
  <text x="765" y="196" fill="#a1a1aa" font-size="11" text-anchor="middle">Single-Corridor Search Only</text>
  <text x="765" y="214" fill="#71717a" font-size="10" text-anchor="middle">Cannot aggregate 60 + 40 RGB</text>
  <text x="765" y="228" fill="#71717a" font-size="10" text-anchor="middle">Strands liquidity at leaf nodes</text>

  <line x1="880" y1="198" x2="935" y2="198" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- Baseline Outcome -->
  <rect x="940" y="152" width="195" height="92" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="1037" y="178" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Baseline Result</text>
  <text x="1037" y="198" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">7 / 20 Succeeded (35%)</text>
  <text x="1037" y="216" fill="#fca5a5" font-size="10.5" text-anchor="middle">0 MPP Splits " 5,700 msat fees</text>
  <text x="1037" y="232" fill="#fca5a5" font-size="10" text-anchor="middle">5,100 msat 3-hop detour on #11</text>

  <!-- BOTTOM LANE: AIR-GB AI + MPP STACK -->
  <rect x="40" y="285" width="1120" height="355" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <rect x="56" y="300" width="320" height="24" rx="4" fill="#064e3b"/>
  <text x="66" y="316" fill="#6ee7b7" font-size="11" font-weight="700">AIR-GB AI + MPP STACK (air-gb-lightning + QVAC Local LLM)</text>

  <!-- Stage 1 -->
  <rect x="60" y="340" width="235" height="135" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="75" y="364" fill="#38bdf8" font-size="12.5" font-weight="700">Stage 1: NL Policy Compiler</text>
  <text x="75" y="382" fill="#e2e8f0" font-size="10.5" font-family="monospace">interpret.ts ’ compile.ts</text>
  <text x="75" y="402" fill="#cbd5e1" font-size="10.5">" Parses user prompt constraints:</text>
  <text x="85" y="418" fill="#94a3b8" font-size="10">- Fee limits (e.g., max_fee_msat)</text>
  <text x="85" y="433" fill="#94a3b8" font-size="10">- Node exclusions (excluded_nodes)</text>
  <text x="85" y="448" fill="#94a3b8" font-size="10">- Privacy: avoid_extra_probing</text>
  <text x="85" y="463" fill="#94a3b8" font-size="10">- Priority: low_fee / reliability</text>

  <line x1="295" y1="407" x2="325" y2="407" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)"/>

  <!-- Stage 2 -->
  <rect x="330" y="340" width="265" height="135" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="345" y="364" fill="#38bdf8" font-size="12.5" font-weight="700">Stage 2: QVAC RAG + Scorer</text>
  <text x="345" y="382" fill="#e2e8f0" font-size="10.5" font-family="monospace">channel-scoring.ts (TurboVec)</text>
  <text x="345" y="402" fill="#cbd5e1" font-size="10.5">" Node-scoped 1st-party SQLite + RAG</text>
  <text x="345" y="418" fill="#cbd5e1" font-size="10.5">" Qwen3.5-0.8B classifies live channels</text>
  <text x="345" y="434" fill="#34d399" font-size="10" font-weight="600">" Physical Liquidity Guardrail:</text>
  <text x="355" y="449" fill="#94a3b8" font-size="10">Verified local BTC/RGB balances cannot</text>
  <text x="355" y="463" fill="#94a3b8" font-size="10">be downgraded to insufficient_liquidity</text>

  <line x1="595" y1="407" x2="625" y2="407" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)"/>

  <!-- Stage 3 -->
  <rect x="630" y="340" width="255" height="135" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="645" y="364" fill="#38bdf8" font-size="12.5" font-weight="700">Stage 3: Strategy Selector</text>
  <text x="645" y="382" fill="#e2e8f0" font-size="10.5" font-family="monospace">routing-selector.ts</text>
  <text x="645" y="402" fill="#cbd5e1" font-size="10.5">" EphemeralRoutingContext (RAM wipe)</text>
  <text x="645" y="418" fill="#cbd5e1" font-size="10.5">" Filters 0-RGB channels from MPP count</text>
  <text x="645" y="434" fill="#34d399" font-size="10" font-weight="600">" Deterministic Guardrails:</text>
  <text x="655" y="449" fill="#94a3b8" font-size="10">- Upgrade to min_cost_flow if &gt;1 path</text>
  <text x="655" y="463" fill="#94a3b8" font-size="10">- Cap max_paths=2; force 1 on privacy</text>

  <line x1="885" y1="407" x2="915" y2="407" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Stage 4 -->
  <rect x="920" y="340" width="220" height="135" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="935" y="364" fill="#6ee7b7" font-size="12.5" font-weight="700">Stage 4: Rust LDK MPP</text>
  <text x="935" y="382" fill="#d1fae5" font-size="10.5" font-family="monospace">routes.rs + channel.rs</text>
  <text x="935" y="402" fill="#ecfdf5" font-size="10.5">" 4 Native Graph Planners:</text>
  <text x="945" y="417" fill="#a7f3d0" font-size="10">1. min_cost_flow (RGB MPP)</text>
  <text x="945" y="431" fill="#a7f3d0" font-size="10">2. multi_objective (Pareto)</text>
  <text x="945" y="445" fill="#a7f3d0" font-size="10">3. yen (K-shortest paths)</text>
  <text x="945" y="459" fill="#a7f3d0" font-size="10">4. ldk_dijkstra (Fallback)</text>

  <!-- Bottom Row inside AIR-GB Box: Deep Protocol Fixes & Final Outcome -->
  <rect x="60" y="495" width="760" height="125" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="78" y="520" fill="#fbbf24" font-size="12.5" font-weight="700">Critical Protocol &amp; Infrastructure Fixes Engineered Under the Hood</text>

  <text x="78" y="542" fill="#e2e8f0" font-size="11" font-weight="600">1. Multi-HTLC RGB Commitment Coloring Fix (color_commitment in rgb_utils/mod.rs &amp; ln/channel.rs):</text>
  <text x="92" y="558" fill="#94a3b8" font-size="10.5">Stock RLN subtracted HTLC RGB amounts from stale last_rgb_payment_info. Fixed to compute exact settled delta</text>
  <text x="92" y="573" fill="#94a3b8" font-size="10.5">(value_to_self_claimed_rgb - value_to_remote_claimed_rgb) and enforce available_outbound_rgb / available_inbound_rgb.</text>

  <text x="78" y="595" fill="#e2e8f0" font-size="11" font-weight="600">2. Gossip Convergence &amp; Peer Reconnect Readiness (assertPaymentReady + /benchmark/gossip-status):</text>
  <text x="92" y="610" fill="#94a3b8" font-size="10.5">Eliminates cold-start routing races by verifying all 15 channels have bidirectional channel_update gossip before Case 01.</text>

  <!-- Final Outcome Box -->
  <rect x="840" y="495" width="300" height="125" rx="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>
  <text x="990" y="522" fill="#ecfdf5" font-size="14" font-weight="700" text-anchor="middle">AIR-GB Benchmark Result</text>
  <text x="990" y="546" fill="#34d399" font-size="16" font-weight="800" text-anchor="middle">13 / 20 Succeeded (65%)</text>
  <text x="990" y="566" fill="#a7f3d0" font-size="11.5" font-weight="600" text-anchor="middle">81.25% on Reachable Scenarios (13/16)</text>
  <text x="990" y="586" fill="#d1fae5" font-size="11" text-anchor="middle">1,200 msat Matched Fees (-78.95%)</text>
  <text x="990" y="604" fill="#6ee7b7" font-size="10.5" text-anchor="middle">0.661.35 ms Rust Planner Execution</text>
</svg>
