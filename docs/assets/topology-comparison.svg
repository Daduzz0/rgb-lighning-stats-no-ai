  <!-- Right Panel: Engineering Improvements in topology-mpp.json -->
  <rect x="896" y="152" width="264" height="440" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="914" y="182" fill="#f8fafc" font-size="14" font-weight="700">Why topology-mpp.json?</text>
  <text x="914" y="200" fill="#94a3b8" font-size="11">4 protocol bottlenecks solved:</text>

  <!-- Card 1 -->
  <rect x="910" y="214" width="236" height="82" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="922" y="232" fill="#34d399" font-size="11.5" font-weight="700">1. LDK 1% Reserve Cushion</text>
  <text x="922" y="249" fill="#cbd5e1" font-size="10.5">push_msat: 7,000,000 (7k sat).</text>
  <text x="922" y="264" fill="#94a3b8" font-size="10">Clears LDK's 10M msat reserve so</text>
  <text x="922" y="278" fill="#94a3b8" font-size="10">Judy can route 100 RGB back (Case 03).</text>

  <!-- Card 2 -->
  <rect x="910" y="306" width="236" height="86" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="922" y="324" fill="#60a5fa" font-size="11.5" font-weight="700">2. Low-Fee MPP Corridors</text>
  <text x="922" y="341" fill="#cbd5e1" font-size="10.5">Carol-Frank-Ivan: 100 msat/hop (300)</text>
  <text x="922" y="356" fill="#cbd5e1" font-size="10.5">Bob-Erin-Heidi: 200 msat/hop (600)</text>
  <text x="922" y="372" fill="#94a3b8" font-size="10">100 RGB split = 60+40 for 900 msat.</text>

  <!-- Card 3 -->
  <rect x="910" y="402" width="236" height="86" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="922" y="420" fill="#fbbf24" font-size="11.5" font-weight="700">3. Reverse Cross-Link Guards</text>
  <text x="922" y="437" fill="#cbd5e1" font-size="10.5">Cross-edges set to 5,000 msat in</text>
  <text x="922" y="452" fill="#cbd5e1" font-size="10.5">Judy’Alice direction (&gt;1k default).</text>
  <text x="922" y="468" fill="#94a3b8" font-size="10">Prevents &gt;2 path MCF fragmentation.</text>

  <!-- Card 4 -->
  <rect x="910" y="498" width="236" height="80" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="922" y="516" fill="#c084fc" font-size="11.5" font-weight="700">4. Heidi’Frank Privacy Hop</text>
  <text x="922" y="533" fill="#cbd5e1" font-size="10.5">Reversed Frank-Heidi to Heidi’Frank</text>
  <text x="922" y="548" fill="#cbd5e1" font-size="10.5">(20 RGB) so Heidi can reach Ivan</text>
  <text x="922" y="563" fill="#94a3b8" font-size="10">in 18-rgb-privacy (single-path).</text>

  <!-- Bottom Bar: Peripheral Nodes (Karl..Tara) -->
  <rect x="40" y="606" width="1120" height="118" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="632" fill="#f8fafc" font-size="13" font-weight="700">10 Peripheral Nodes (Karl  Tara) " Negative Control Reachability Island (Cases 19 &amp; 20)</text>
  <text x="60" y="650" fill="#94a3b8" font-size="11">Online with funded wallets and P2P connections, but 0 open Lightning channels in the benchmark fixture  verifying that both routers cleanly reject unreachable destinations.</text>

