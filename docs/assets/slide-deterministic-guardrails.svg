<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Ubuntu Sans, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgGuard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrGuard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGuard)"/>
  <rect x="16" y="16" width="1168" height="648" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="54" fill="#f8fafc" font-size="22" font-weight="700">Zero-Hallucination Architecture: 4 Deterministic Guardrail Gates</text>
  <text x="40" y="78" fill="#94a3b8" font-size="13">How AIR-GB guarantees no 0.8B LLM hallucination, truncation, or liquidity mistake can ever reach the Lightning network</text>

  <!-- GATE 1 -->
  <rect x="40" y="104" width="262" height="410" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="54" y="120" width="234" height="32" rx="6" fill="#0c4a6e"/>
  <text x="171" y="141" fill="#7dd3fc" font-size="12.5" font-weight="700" text-anchor="middle">GATE 1: Grammar Locking</text>
  <text x="171" y="168" fill="#94a3b8" font-size="10.5" font-family="Ubuntu Sans Mono, monospace" text-anchor="middle">dynamicInferenceSchema</text>

  <rect x="54" y="182" width="234" height="96" rx="6" fill="#1e293b"/>
  <text x="66" y="202" fill="#f87171" font-size="10.5" font-weight="700">Threat Blocked:</text>
  <text x="66" y="220" fill="#cbd5e1" font-size="10">Small 0.8B model inventing channel</text>
  <text x="66" y="235" fill="#cbd5e1" font-size="10">IDs, corrupting 66-char hex pubkeys,</text>
  <text x="66" y="250" fill="#cbd5e1" font-size="10">or looping array items until</text>
  <text x="66" y="265" fill="#cbd5e1" font-size="10">finish_reason === "length".</text>

  <rect x="54" y="290" width="234" height="208" rx="6" fill="#111827" stroke="#334155"/>
  <text x="66" y="312" fill="#34d399" font-size="10.5" font-weight="700">Deterministic Enforcement:</text>
  <text x="66" y="332" fill="#e2e8f0" font-size="10">&#8226; Per-request JSON Schema built</text>
  <text x="74" y="347" fill="#94a3b8" font-size="9.5">from live RLN /listchannels</text>
  <text x="66" y="367" fill="#e2e8f0" font-size="10">&#8226; <tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">channelId: { enum: liveIds }</tspan></text>
  <text x="66" y="387" fill="#e2e8f0" font-size="10">&#8226; <tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">minItems = maxItems = N</tspan></text>
  <text x="66" y="407" fill="#e2e8f0" font-size="10">&#8226; 66-char <tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">peerNodeId</tspan> stripped</text>
  <text x="74" y="422" fill="#94a3b8" font-size="9.5">from LLM prompt &amp; re-attached</text>
  <text x="74" y="437" fill="#94a3b8" font-size="9.5">deterministically in post-pass</text>
  <text x="66" y="457" fill="#e2e8f0" font-size="10">&#8226; Any invented channel ID is</text>
  <text x="74" y="472" fill="#94a3b8" font-size="9.5">dropped during array mapping</text>

  <line x1="302" y1="309" x2="322" y2="309" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGuard)"/>

  <!-- GATE 2 -->
  <rect x="326" y="104" width="262" height="410" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <rect x="340" y="120" width="234" height="32" rx="6" fill="#3b0764"/>
  <text x="457" y="141" fill="#e9d5ff" font-size="12.5" font-weight="700" text-anchor="middle">GATE 2: Semantic &amp; Crypto</text>
  <text x="457" y="168" fill="#94a3b8" font-size="10.5" font-family="Ubuntu Sans Mono, monospace" text-anchor="middle">parseExtraction + compile.ts</text>

  <rect x="340" y="182" width="234" height="96" rx="6" fill="#1e293b"/>
  <text x="352" y="202" fill="#f87171" font-size="10.5" font-weight="700">Threat Blocked:</text>
  <text x="352" y="220" fill="#cbd5e1" font-size="10">Prompt injection ("send now"),</text>
  <text x="352" y="235" fill="#cbd5e1" font-size="10">hallucinated fee caps, inverted</text>
  <text x="352" y="250" fill="#cbd5e1" font-size="10">negations ("don't exclude Bob"),</text>
  <text x="352" y="265" fill="#cbd5e1" font-size="10">or excluding the invoice payee.</text>

  <rect x="340" y="290" width="234" height="208" rx="6" fill="#111827" stroke="#334155"/>
  <text x="352" y="312" fill="#34d399" font-size="10.5" font-weight="700">Deterministic Enforcement:</text>
  <text x="352" y="332" fill="#e2e8f0" font-size="10">&#8226; Verifies every extracted fee,</text>
  <text x="360" y="347" fill="#94a3b8" font-size="9.5">unit &amp; alias is a literal</text>
  <text x="360" y="362" fill="#94a3b8" font-size="9.5">substring of user text (AI_SEMANTIC)</text>
  <text x="352" y="382" fill="#e2e8f0" font-size="10">&#8226; Validates 33-byte secp256k1 point</text>
  <text x="360" y="397" fill="#94a3b8" font-size="9.5">via <tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">crypto.ECDH.convertKey()</tspan></text>
  <text x="352" y="417" fill="#e2e8f0" font-size="10">&#8226; Rejects excluding <tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">payeePubkey</tspan></text>
  <text x="360" y="432" fill="#94a3b8" font-size="9.5">with CONSTRAINT_CONFLICT</text>
  <text x="352" y="452" fill="#e2e8f0" font-size="10">&#8226; Binds policy to <tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">SHA-256</tspan> hash of</text>
  <text x="360" y="467" fill="#94a3b8" font-size="9.5"><tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">{invoice, amount, assetId}</tspan></text>

  <line x1="588" y1="309" x2="608" y2="309" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGuard)"/>

  <!-- GATE 3 -->
  <rect x="612" y="104" width="262" height="410" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <rect x="626" y="120" width="234" height="32" rx="6" fill="#451a03"/>
  <text x="743" y="141" fill="#fcd34d" font-size="12.5" font-weight="700" text-anchor="middle">GATE 3: Bilateral Liquidity</text>
  <text x="743" y="168" fill="#94a3b8" font-size="10.5" font-family="Ubuntu Sans Mono, monospace" text-anchor="middle">sanitizeAndValidateChannelScore</text>

  <rect x="626" y="182" width="234" height="96" rx="6" fill="#1e293b"/>
  <text x="638" y="202" fill="#f87171" font-size="10.5" font-weight="700">Threat Blocked:</text>
  <text x="638" y="220" fill="#cbd5e1" font-size="10">1) Promoting an offline/underfunded</text>
  <text x="638" y="235" fill="#cbd5e1" font-size="10">channel to optimal/good, OR</text>
  <text x="638" y="250" fill="#cbd5e1" font-size="10">2) Falsely downgrading a valid</text>
  <text x="638" y="265" fill="#cbd5e1" font-size="10">partial MPP channel to avoid.</text>

  <rect x="626" y="290" width="234" height="208" rx="6" fill="#111827" stroke="#334155"/>
  <text x="638" y="312" fill="#34d399" font-size="10.5" font-weight="700">Deterministic Enforcement:</text>
  <text x="638" y="332" fill="#e2e8f0" font-size="10">&#8226; Computes <tspan fill="#fcd34d" font-family="Ubuntu Sans Mono, monospace">fallback</tspan> from live</text>
  <text x="646" y="347" fill="#94a3b8" font-size="9.5">BigInt BTC &amp; RGB balances first</text>
  <text x="638" y="367" fill="#e2e8f0" font-size="10">&#8226; If <tspan fill="#fcd34d" font-family="Ubuntu Sans Mono, monospace">!isUsable</tspan> &#8594; forced <tspan fill="#fca5a5" font-family="Ubuntu Sans Mono, monospace">avoid</tspan></text>
  <text x="638" y="387" fill="#e2e8f0" font-size="10">&#8226; If underfunded &#8594; forced</text>
  <text x="646" y="402" fill="#fca5a5" font-size="9.5" font-family="Ubuntu Sans Mono, monospace">insufficient_liquidity</text>
  <text x="638" y="422" fill="#e2e8f0" font-size="10">&#8226; If physically sufficient &#8594; LLM</text>
  <text x="646" y="437" fill="#94a3b8" font-size="9.5">is blocked from outputting</text>
  <text x="646" y="452" fill="#94a3b8" font-size="9.5">insufficient_liquidity or avoid</text>
  <text x="638" y="472" fill="#e2e8f0" font-size="10">&#8226; Clamps weights to <tspan fill="#fcd34d" font-family="Ubuntu Sans Mono, monospace">[1..1000]</tspan></text>

  <line x1="874" y1="309" x2="894" y2="309" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGuard)"/>

  <!-- GATE 4 -->
  <rect x="898" y="104" width="262" height="410" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <rect x="912" y="120" width="234" height="32" rx="6" fill="#064e3b"/>
  <text x="1029" y="141" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle">GATE 4: Strategy &amp; Rust</text>
  <text x="1029" y="168" fill="#94a3b8" font-size="10.5" font-family="Ubuntu Sans Mono, monospace" text-anchor="middle">routing-selector.ts + routes.rs</text>

  <rect x="912" y="182" width="234" height="96" rx="6" fill="#1e293b"/>
  <text x="924" y="202" fill="#f87171" font-size="10.5" font-weight="700">Threat Blocked:</text>
  <text x="924" y="220" fill="#cbd5e1" font-size="10">Picking single-path when MPP split</text>
  <text x="924" y="235" fill="#cbd5e1" font-size="10">is physically required, violating</text>
  <text x="924" y="250" fill="#cbd5e1" font-size="10">privacy single-path, or counting</text>
  <text x="924" y="265" fill="#cbd5e1" font-size="10">0-RGB channels as MPP shards.</text>

  <rect x="912" y="290" width="234" height="208" rx="6" fill="#111827" stroke="#334155"/>
  <text x="924" y="312" fill="#34d399" font-size="10.5" font-weight="700">Deterministic Enforcement:</text>
  <text x="924" y="332" fill="#e2e8f0" font-size="10">&#8226; <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">mppContributors</tspan> requires</text>
  <text x="932" y="347" fill="#94a3b8" font-size="9.5">both BTC &gt; 0 and RGB &gt; 0</text>
  <text x="924" y="367" fill="#e2e8f0" font-size="10">&#8226; Rule 1: <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">avoid_extra_probing</tspan></text>
  <text x="932" y="382" fill="#94a3b8" font-size="9.5">forces <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">max_paths = 1</tspan></text>
  <text x="924" y="402" fill="#e2e8f0" font-size="10">&#8226; Rule 2: <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">!singlePath &amp;&amp; mpp</tspan></text>
  <text x="932" y="417" fill="#94a3b8" font-size="9.5">forces <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">min_cost_flow (k &gt;= 2)</tspan></text>
  <text x="924" y="437" fill="#e2e8f0" font-size="10">&#8226; Rust <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">routes.rs</tspan> enforces</text>
  <text x="932" y="452" fill="#94a3b8" font-size="9.5"><tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">available_outbound_rgb()</tspan> &amp;</text>
  <text x="932" y="467" fill="#94a3b8" font-size="9.5"><tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">max_fee_msat</tspan> before wire HTLC</text>

  <!-- BOTTOM AUDIT & VERIFICATION BANNER -->
  <rect x="40" y="534" width="1120" height="106" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="64" y="562" fill="#f8fafc" font-size="14" font-weight="700">Full Auditability in Benchmark &amp; Production (selectionSource = "qvac_with_guardrails")</text>
  <text x="64" y="586" fill="#cbd5e1" font-size="11.5">&#8226; Every payment decision records both <tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">decision.modelDecision</tspan> (raw QVAC proposal) and <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">decision.recommendedRouting</tspan> (post-guardrail policy).</text>
  <text x="64" y="606" fill="#cbd5e1" font-size="11.5">&#8226; Verified by <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">52 / 52</tspan> contract tests in <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">fixture-scoring.test.ts</tspan> (malformed JSON, null channels, invented channel IDs, and physical balance overrides).</text>
  <text x="64" y="626" fill="#34d399" font-size="11.5" font-weight="700">&#10003; Result: Sub-second local AI adaptability with 100% deterministic financial and cryptographic safety.</text>
</svg>
