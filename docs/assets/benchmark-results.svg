  </defs>

  <rect width="1200" height="620" rx="16" fill="url(#bgChart)"/>
  <rect x="16" y="16" width="1168" height="588" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="54" fill="#f8fafc" font-size="22" font-weight="700">Sequential Regtest Benchmark Results: Baseline (No AI) vs. AIR-GB (QVAC + MPP)</text>
  <text x="40" y="78" fill="#94a3b8" font-size="13">Identical Starting State Hash (fc59bc78...8b45) " 20 Live Regtest Scenarios on topology-mpp.json (16 Reachable + 4 Negative Controls)</text>

  <!-- PANEL 1: SUCCESS RATE -->
  <rect x="40" y="102" width="360" height="320" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="64" y="132" fill="#f8fafc" font-size="15" font-weight="700">1. Payment Success Rate</text>
  <text x="64" y="150" fill="#94a3b8" font-size="11.5">Out of 20 Total / 16 Feasible Scenarios</text>

  <!-- Baseline Bar -->
  <rect x="95" y="275" width="90" height="105" rx="6" fill="url(#stockBar)"/>
  <text x="140" y="252" fill="#fda4af" font-size="18" font-weight="800" text-anchor="middle">35.0%</text>
  <text x="140" y="268" fill="#f43f5e" font-size="11" font-weight="600" text-anchor="middle">7 / 20 (43.8% of 16)</text>
  <text x="140" y="400" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">Baseline (No AI)</text>

  <!-- AI + MPP Bar -->
  <rect x="245" y="185" width="90" height="195" rx="6" fill="url(#aiBar)"/>
  <text x="290" y="162" fill="#6ee7b7" font-size="18" font-weight="800" text-anchor="middle">65.0%</text>
  <text x="290" y="178" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">13 / 20 (81.3% of 16)</text>
  <text x="290" y="400" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">AIR-GB (AI+MPP)</text>

  <!-- Delta Badge -->
  <rect x="170" y="205" width="68" height="26" rx="13" fill="#064e3b" stroke="#10b981"/>
  <text x="204" y="222" fill="#34d399" font-size="11.5" font-weight="800" text-anchor="middle">+30 pp</text>

  <!-- PANEL 2: ROUTING FEES ON MATCHED SUCCESSES -->
  <rect x="420" y="102" width="360" height="320" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="444" y="132" fill="#f8fafc" font-size="15" font-weight="700">2. Routing Fees Paid (Matched Pairs)</text>
  <text x="444" y="150" fill="#94a3b8" font-size="11.5">Total msat across 5 paired successes (01, 09, 11, 14, 16)</text>

