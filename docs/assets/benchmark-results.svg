  <text x="520" y="168" fill="#fda4af" font-size="17" font-weight="800" text-anchor="middle">5,700 msat</text>
  <text x="520" y="183" fill="#f43f5e" font-size="10.5" font-weight="600" text-anchor="middle">5,100 msat detour on #11</text>
  <text x="520" y="400" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">Baseline (No AI)</text>

