<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Ubuntu Sans, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="slideBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="55%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#slideBg)"/>
  <rect x="0" y="0" width="1920" height="6" fill="url(#topAccent)"/>

  <!-- Header Bar -->
  <rect x="0" y="6" width="1920" height="114" fill="#090d16" fill-opacity="0.85"/>
  <line x1="0" y1="120" x2="1920" y2="120" stroke="#1e293b" stroke-width="2"/>

  <!-- Category Pill -->
  <rect x="48" y="24" width="290" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="193" y="42" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">EXECUTIVE OVERVIEW</text>

  <!-- Slide Title & Subtitle -->
  <text x="48" y="80" fill="#f8fafc" font-size="30" font-weight="800">AIR-GB Lightning: Native Multi-Path RGB Routing &amp; Local QVAC AI</text>
  <text x="48" y="106" fill="#94a3b8" font-size="15.5">Solving Single-Path RGB Liquidity Stranding &amp; High-Fee Detours on the Bitcoin Lightning Network</text>

  <!-- Top-Right Timing & Slide Counter -->
  <rect x="1580" y="34" width="165" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1662" y="53" fill="#94a3b8" font-size="10.5" font-weight="700" text-anchor="middle">TIMING SLOT</text>
  <text x="1662" y="70" fill="#38bdf8" font-size="13.5" font-weight="700" font-family="Ubuntu Sans Mono, monospace" text-anchor="middle">0:00 - 0:30</text>

  <rect x="1760" y="34" width="112" height="44" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1816" y="63" fill="#ecfdf5" font-size="18" font-weight="800" font-family="Ubuntu Sans Mono, monospace" text-anchor="middle">01 / 09</text>

  <!-- Slide Body -->
  
  <!-- Hero Banner -->
  <rect x="48" y="146" width="1824" height="220" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
  <rect x="80" y="174" width="380" height="30" rx="6" fill="#064e3b"/>
  <text x="96" y="194" fill="#6ee7b7" font-size="13.5" font-weight="800">THE CORE BREAKTHROUGH FOR RGB SMART CONTRACTS</text>

  <text x="80" y="242" fill="#f8fafc" font-size="34" font-weight="800">First Native Multi-Path Payment (MPP) Engine for RGB Assets on Lightning,</text>
  <text x="80" y="284" fill="#38bdf8" font-size="30" font-weight="700">Guided by Local QVAC AI (Qwen3.5-0.8B + TurboVec RAG) &amp; 4 Deterministic Guardrails</text>
  <text x="80" y="328" fill="#cbd5e1" font-size="17">Validated head-to-head against stock single-path rgb-lightning-node across 20 sequential scenarios on a 20-node live regtest topology.</text>

  <!-- 4 KPI Cards Row -->
  <rect x="48" y="392" width="435" height="270" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="265" y="432" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">OVERALL BENCHMARK SUCCESS</text>
  <text x="265" y="502" fill="#34d399" font-size="56" font-weight="800" text-anchor="middle">35% &#8594; 65%</text>
  <text x="265" y="544" fill="#ecfdf5" font-size="18" font-weight="700" text-anchor="middle">13 / 20 vs. 7 / 20 Scenarios</text>
  <text x="265" y="582" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">81.25% on Reachable Scenarios (13 / 16)</text>
  <text x="265" y="616" fill="#94a3b8" font-size="13.5" text-anchor="middle">+85.7% more completed transfers</text>

  <rect x="511" y="392" width="435" height="270" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="728" y="432" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">MATCHED-PAIR ROUTING FEES</text>
  <text x="728" y="502" fill="#34d399" font-size="56" font-weight="800" text-anchor="middle">-78.95%</text>
  <text x="728" y="544" fill="#ecfdf5" font-size="18" font-weight="700" text-anchor="middle">1,200 msat vs. 5,700 msat</text>
  <text x="728" y="582" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">Case #11: 0 msat (1 hop) vs. 5,100 msat</text>
  <text x="728" y="616" fill="#94a3b8" font-size="13.5" text-anchor="middle">Eliminates channel-drain fee detours</text>

  <rect x="974" y="392" width="435" height="270" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="1191" y="432" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">MULTI-PATH &amp; RETURN FLOWS</text>
  <text x="1191" y="502" fill="#38bdf8" font-size="56" font-weight="800" text-anchor="middle">3 / 3 MPP</text>
  <text x="1191" y="544" fill="#ecfdf5" font-size="18" font-weight="700" text-anchor="middle">60+40 RGB &amp; 40+40 RGB Splits</text>
  <text x="1191" y="582" fill="#7dd3fc" font-size="15" font-weight="700" text-anchor="middle">190 RGB Returned to Alice (vs. 0)</text>
  <text x="1191" y="616" fill="#94a3b8" font-size="13.5" text-anchor="middle">Fixed LDK multi-HTLC color_commitment</text>

  <rect x="1437" y="392" width="435" height="270" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="1654" y="432" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">ON-NODE RUST PLANNER SPEED</text>
  <text x="1654" y="502" fill="#d8b4fe" font-size="50" font-weight="800" text-anchor="middle">0.66-1.35 ms</text>
  <text x="1654" y="544" fill="#ecfdf5" font-size="18" font-weight="700" text-anchor="middle">4 Native Rust Graph Solvers</text>
  <text x="1654" y="582" fill="#e9d5ff" font-size="15" font-weight="700" text-anchor="middle">100% Local AI + 0 Hallucination Risk</text>
  <text x="1654" y="616" fill="#94a3b8" font-size="13.5" text-anchor="middle">52 / 52 safety contract tests passing</text>

  <!-- 3 Architectural Pillars Row -->
  <rect x="48" y="690" width="588" height="304" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="76" y="730" fill="#34d399" font-size="20" font-weight="800">1. Custom Rust RLN + LDK MPP Engine</text>
  <text x="76" y="766" fill="#e2e8f0" font-size="15">&#8226; 4 Graph Planners: <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">min_cost_flow</tspan>, <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">multi_objective</tspan>,</text>
  <text x="92" y="792" fill="#cbd5e1" font-size="14.5"><tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">yen</tspan> (K-shortest), and <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">ldk_dijkstra</tspan>.</text>
  <text x="76" y="826" fill="#e2e8f0" font-size="15">&#8226; Proportional BTC carrier splitting (&gt;= 3,000 sat/shard)</text>
  <text x="92" y="852" fill="#cbd5e1" font-size="14.5">+ atomic dual-asset aggregation at recipient.</text>
  <text x="76" y="886" fill="#e2e8f0" font-size="15">&#8226; Solved upstream LDK multi-HTLC commitment coloring</text>
  <text x="92" y="912" fill="#cbd5e1" font-size="14.5">bug via exact claimed-preimage RGB delta accounting.</text>
  <text x="76" y="954" fill="#6ee7b7" font-size="13.5" font-family="Ubuntu Sans Mono, monospace">Commits: rgb-lightning-node@7106edd &#8226; rust-lightning@2f19847</text>

  <rect x="666" y="690" width="588" height="304" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="694" y="730" fill="#38bdf8" font-size="20" font-weight="800">2. Local QVAC AI + Node-Scoped TurboVec RAG</text>
  <text x="694" y="766" fill="#e2e8f0" font-size="15">&#8226; <tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">EMBEDDINGGEMMA_300M_Q4_0</tspan>: 768-dim embeddings in</text>
  <text x="710" y="792" fill="#cbd5e1" font-size="14.5">QVAC <tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">turbovec-q4</tspan> SIMD index + HyperDB reranking.</text>
  <text x="694" y="826" fill="#e2e8f0" font-size="15">&#8226; <tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">QWEN3_5_0_8B_MULTIMODAL_Q4_K_M</tspan>: 3 structured JSON</text>
  <text x="710" y="852" fill="#cbd5e1" font-size="14.5">passes (NL intent compiler, channel scorer, algo selector).</text>
  <text x="694" y="886" fill="#e2e8f0" font-size="15">&#8226; Strictly first-party telemetry (<tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">assertFirstPartyEpisode</tspan>)</text>
  <text x="710" y="912" fill="#cbd5e1" font-size="14.5">+ request-scoped RAM wipe (<tspan fill="#7dd3fc" font-family="Ubuntu Sans Mono, monospace">EphemeralRoutingContext</tspan>).</text>
  <text x="694" y="954" fill="#7dd3fc" font-size="13.5" font-family="Ubuntu Sans Mono, monospace">100% Local Loopback (127.0.0.1:11434) &#8226; Zero Cloud APIs</text>

  <rect x="1284" y="690" width="588" height="304" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="1312" y="730" fill="#c084fc" font-size="20" font-weight="800">3. Deterministic Safety &amp; Live Verification</text>
  <text x="1312" y="766" fill="#e2e8f0" font-size="15">&#8226; 4 Deterministic Guardrail Gates block invented IDs,</text>
  <text x="1328" y="792" fill="#cbd5e1" font-size="14.5">prompt injection, and liquidity hallucinations.</text>
  <text x="1312" y="826" fill="#e2e8f0" font-size="15">&#8226; Cryptographic <tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">SHA-256</tspan> policy binding + <tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">secp256k1</tspan></text>
  <text x="1328" y="852" fill="#cbd5e1" font-size="14.5">point validation + bilateral balance overrides.</text>
  <text x="1312" y="886" fill="#e2e8f0" font-size="15">&#8226; Reproducible 20-node Docker regtest benchmark</text>
  <text x="1328" y="912" fill="#cbd5e1" font-size="14.5">starting from identical state hash <tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">fc59bc78...8b45</tspan>.</text>
  <text x="1312" y="954" fill="#d8b4fe" font-size="13.5" font-family="Ubuntu Sans Mono, monospace">Presentation Structure: 8 Technical Slides + Live Demo</text>
  

  <!-- Footer Bar -->
  <rect x="0" y="1024" width="1920" height="56" fill="#060911"/>
  <line x1="0" y1="1024" x2="1920" y2="1024" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="0" y="1074" width="1920" height="6" fill="#1e293b"/>
  <rect x="0" y="1074" width="213" height="6" fill="url(#topAccent)"/>

  <text x="48" y="1056" fill="#64748b" font-size="13" font-weight="600">AIR-GB Lightning &#8226; rgb-lightning-node (7106edd) + rust-lightning (2f19847) + QVAC Local AI</text>
  <text x="1872" y="1056" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">10-Minute Presentation: 5m Slides &#8226; 2m Live Web UI Demo &#8226; 3m Judge Q&amp;A</text>
</svg>