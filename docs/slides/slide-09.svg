  <text x="446" y="272" fill="#e2e8f0" font-size="11">&#8226; Inspect live channel classifications</text>
  <text x="456" y="288" fill="#cbd5e1" font-size="10.5">(<tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">optimal</tspan>, <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">good</tspan>, <tspan fill="#fcd34d" font-family="Ubuntu Sans Mono, monospace">congested</tspan>, <tspan fill="#fca5a5" font-family="Ubuntu Sans Mono, monospace">avoid</tspan>),</text>
