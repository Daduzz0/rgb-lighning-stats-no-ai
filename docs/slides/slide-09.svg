  <text x="446" y="218" fill="#e2e8f0" font-size="11">&#8226; Load node-scoped first-party history</text>
  <text x="456" y="234" fill="#cbd5e1" font-size="10.5">(<tspan fill="#d8b4fe" font-family="Ubuntu Sans Mono, monospace">20 / 100 / 500 / 2000 tx</tspan>) into SQLite</text>
