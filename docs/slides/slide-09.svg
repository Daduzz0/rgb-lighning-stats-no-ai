  <rect x="48" y="142" width="490" height="274" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="66" y="160" width="454" height="34" rx="6" fill="#0c4a6e"/>
  <text x="80" y="182" fill="#7dd3fc" font-size="15" font-weight="800">Demo Part 1: Natural Language Policy</text>
  <text x="68" y="218" fill="#e2e8f0" font-size="14" font-weight="600">&#8226; Open Alice (:8801) in the Web UI (:5173).</text>
<text x="68" y="243" fill="#e2e8f0" font-size="14" font-weight="600">&#8226; Enter natural-language routing constraint</text>
<text x="80" y="268" fill="#94a3b8" font-size="14" font-weight="400">  (fee cap, node exclusion, or privacy mode).</text>
<text x="68" y="293" fill="#e2e8f0" font-size="14" font-weight="600">&#8226; Show QVAC extraction + deterministic</text>
<text x="80" y="318" fill="#94a3b8" font-size="14" font-weight="400">  compileConstraints() producing the SHA-256</text>
<text x="80" y="343" fill="#94a3b8" font-size="14" font-weight="400">  paymentFingerprint &amp; CompiledPolicy badge.</text>

  <rect x="48" y="434" width="490" height="274" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <rect x="66" y="452" width="454" height="34" rx="6" fill="#3b0764"/>
  <text x="80" y="474" fill="#e9d5ff" font-size="15" font-weight="800">Demo Part 2: First-Party RAG &amp; Scoring</text>
  <text x="68" y="510" fill="#e2e8f0" font-size="14" font-weight="600">&#8226; Load node-scoped first-party history into</text>
<text x="80" y="535" fill="#94a3b8" font-size="14" font-weight="400">  SQLite + QVAC TurboVec (/v1/vector_stores).</text>
<text x="68" y="560" fill="#e2e8f0" font-size="14" font-weight="600">&#8226; Run live Channel Scoring: inspect per-channel</text>
<text x="80" y="585" fill="#94a3b8" font-size="14" font-weight="400">  classifications (optimal, good, congested,</text>
<text x="80" y="610" fill="#94a3b8" font-size="14" font-weight="400">  avoid), 0-100 scores, Pareto weights, and</text>
<text x="80" y="635" fill="#94a3b8" font-size="14" font-weight="400">  retrieved RAG telemetry episodes.</text>

  <rect x="48" y="726" width="490" height="274" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <rect x="66" y="744" width="454" height="34" rx="6" fill="#064e3b"/>
  <text x="80" y="766" fill="#6ee7b7" font-size="15" font-weight="800">Demo Part 3: Dynamic Planner &amp; RGB Send</text>
  <text x="68" y="802" fill="#e2e8f0" font-size="14" font-weight="600">&#8226; Run Dynamic Algorithm Selector: inspect</text>
<text x="80" y="827" fill="#94a3b8" font-size="14" font-weight="400">  EphemeralRoutingContext feasibility &amp; choice</text>
<text x="80" y="852" fill="#94a3b8" font-size="14" font-weight="400">  (min_cost_flow MPP vs. multi_objective).</text>
<text x="68" y="877" fill="#e2e8f0" font-size="14" font-weight="600">&#8226; Execute payment on Rust RLN daemon and</text>
<text x="80" y="902" fill="#94a3b8" font-size="14" font-weight="400">  observe automatic RAG episode ingestion.</text>
<text x="68" y="927" fill="#34d399" font-size="14" font-weight="700">&#10003; Ready for Judge Questions!</text>
