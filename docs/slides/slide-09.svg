  <text x="446" y="326" fill="#34d399" font-size="10.5" font-weight="600">&#10003; Bilateral physical liquidity guardrails</text>

  <line x1="766" y1="246" x2="796" y2="246" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrDemo)"/>

