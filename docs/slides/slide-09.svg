  <text x="818" y="272" fill="#e2e8f0" font-size="11">&#8226; Dispatch to Rust RLN daemon with</text>
  <text x="828" y="288" fill="#cbd5e1" font-size="10.5"><tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">min_cost_flow (max_paths: 2)</tspan> or</text>
  <text x="828" y="304" fill="#cbd5e1" font-size="10.5"><tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">multi_objective</tspan> Pareto weights.</text>
  <text x="818" y="326" fill="#34d399" font-size="10.5" font-weight="600">&#10003; Auto-ingests outcome back into RAG</text>

