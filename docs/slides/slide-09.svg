  <text x="818" y="195" fill="#94a3b8" font-size="10.5" font-family="Ubuntu Sans Mono, monospace">POST /api/routing/select-algorithm</text>
  <text x="818" y="218" fill="#e2e8f0" font-size="11">&#8226; EphemeralRoutingContext computes</text>
  <text x="828" y="234" fill="#cbd5e1" font-size="10.5"><tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">singlePathPossible</tspan> &amp; <tspan fill="#6ee7b7" font-family="Ubuntu Sans Mono, monospace">mppPossible</tspan> in</text>
